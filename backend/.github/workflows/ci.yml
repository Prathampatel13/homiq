name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Quality Gates & Test Suite ───────────────────────────────────────────
  quality-gates:
    name: Code Quality, Security & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: homiq_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/homiq_test_db
      REDIS_URL: redis://localhost:6379/0
      REDIS_BROKER_URL: redis://localhost:6379/0
      REDIS_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci_secret_key_testing_min_32_characters_long
      ENV: testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pytest pytest-cov

      - name: Code Linting & Formatting Check (Ruff)
        run: |
          ruff check app/

      - name: Static Type Checking (MyPy)
        run: |
          mypy app/ --ignore-missing-imports || true

      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r app/ -ll -q

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml

  # ── 2. Docker Image Build Verification ──────────────────────────────────────
  docker-build:
    name: Build & Verify Docker Image
    needs: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: homiq-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
