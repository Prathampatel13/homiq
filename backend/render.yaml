services:
  # HomiQ Backend — Single Free Web Service
  # Runs FastAPI with in-memory fallbacks (no Redis/Celery required).
  # Database: External Neon.tech free PostgreSQL.
  - type: web
    name: homiq-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set this to your Neon.tech PostgreSQL connection string in the Render Dashboard.
        # Example: postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/homiq_db?sslmode=require
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: FRONTEND_URL
        sync: false
        # Set this to your Vercel frontend URL, e.g. https://homiq.vercel.app
      - key: CORS_ORIGINS
        sync: false
        # Set this to your Vercel frontend URL, e.g. https://homiq.vercel.app
