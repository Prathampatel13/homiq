services:
  # ── 1. FastAPI Web Backend Service (100% Free Tier) ──────────────────────
  # This single web service runs FastAPI and Celery simultaneously using start_prod.sh.
  - type: web
    name: homiq-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this to your Neon.tech Postgres URL in Render Dashboard
      - key: REDIS_URL
        sync: false # Set this to your Upstash Redis URL in Render Dashboard
      - key: REDIS_BROKER_URL
        sync: false # Set this to your Upstash Redis URL in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
